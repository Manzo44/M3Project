spring.application.name=M3Project

# Rebuild the task table from the Task entity every time the app starts
spring.jpa.hibernate.ddl-auto=create-drop

# Release the database connection when the request ends
spring.jpa.open-in-view=false

# PostgreSQL on this machine, database taskmanager_db
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager_db
spring.datasource.username=postgres
spring.datasource.password=postgres